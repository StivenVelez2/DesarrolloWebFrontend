<div class="modal-container">
  <h2>Asignar usuario al proyecto</h2>
  <form [formGroup]="assignForm" (ngSubmit)="assignUser()">
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>Selecciona un usuario</mat-label>
      <mat-select formControlName="user_id" required>
        <mat-option *ngIf="isLoading" disabled>
          <mat-spinner diameter="20"></mat-spinner> Cargando usuarios...
        </mat-option>
        <mat-option *ngFor="let user of users" [value]="user.id">
          {{ user.nombre }} {{ user.apellido }} - {{ user.correo }}
        </mat-option>
        <mat-option *ngIf="!isLoading && users.length === 0" disabled>
          No hay usuarios disponibles
        </mat-option>
      </mat-select>
      <mat-error *ngIf="assignForm.get('user_id')?.hasError('required')">
        El usuario es obligatorio
      </mat-error>
    </mat-form-field>
    <div class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="assignForm.invalid || isAssigning">
        <mat-spinner *ngIf="isAssigning" diameter="20"></mat-spinner>
        <span *ngIf="!isAssigning">Asignar</span>
      </button>
      <button mat-stroked-button type="button" (click)="closeDialog()" [disabled]="isAssigning">Cancelar</button>
    </div>
  </form>
</div>
